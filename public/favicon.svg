<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Oopsy">
  <rect width="200" height="200" rx="44" fill="#FFF7EC" />
  <!-- ear nubs -->
  <circle cx="52" cy="72" r="20" fill="#2FB8A6" />
  <circle cx="148" cy="72" r="20" fill="#2FB8A6" />
  <circle cx="52" cy="70" r="9" fill="#FFF3DC" />
  <circle cx="148" cy="70" r="9" fill="#FFF3DC" />
  <!-- signature pencil behind the right ear -->
  <g transform="rotate(28 156 56)">
    <rect x="150" y="32" width="13" height="36" rx="3" fill="#FFC93C" />
    <path d="M150 32 L156.5 19 L163 32 Z" fill="#E8A04C" />
    <rect x="150" y="64" width="13" height="8" rx="3" fill="#FF8A7A" />
  </g>
  <!-- body + belly -->
  <ellipse cx="100" cy="120" rx="74" ry="66" fill="#2FB8A6" />
  <ellipse cx="100" cy="144" rx="48" ry="38" fill="#FFF3DC" />
  <!-- cheeks -->
  <ellipse cx="58" cy="130" rx="12" ry="8" fill="#FF9A8A" opacity="0.65" />
  <ellipse cx="142" cy="130" rx="12" ry="8" fill="#FF9A8A" opacity="0.65" />
  <!-- happy eyes -->
  <path d="M57 106 Q72 89 87 106" stroke="#2B2B33" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M113 106 Q128 89 143 106" stroke="#2B2B33" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- smile -->
  <path d="M80 132 Q100 153 120 132" stroke="#2B2B33" stroke-width="6" stroke-linecap="round" fill="none" />
</svg>
